<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BazarBangla</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b5d3b;--gd:#06402a;--r:#e2384a;--o:#f04e0f;--sf:#ffb43a;--bg:#f5f2ea;--t:#1b2a22;--m:#6c776f;--line:#e6e1d3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--t);padding-bottom:30px}
/* header */
header{background:#fff;position:relative}
header img{display:block;width:100%;aspect-ratio:2.2;object-fit:cover;object-position:56% 50%;max-height:300px}
header::after{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--g) 0 33%,var(--sf) 33% 66%,var(--o) 66%)}
/* search */
.sw{margin:14px 14px 0;position:sticky;top:10px;z-index:6}
.sb{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 14px;box-shadow:0 6px 18px rgba(6,64,42,.18)}
.sb svg{flex:none}
#q{flex:1;border:0;outline:0;padding:14px 0;font:inherit;font-size:16px;background:none}
#inst{display:none;margin:12px 14px 0;width:calc(100% - 28px);padding:12px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:600;font-size:15px}
/* grid */
main{padding:18px 14px 0;max-width:1000px;margin:auto}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.hd h2{font-family:'Baloo Da 2',sans-serif;font-size:21px;color:var(--gd)}
.hd span{font-size:13px;color:var(--m)}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){#grid{grid-template-columns:repeat(4,1fr);gap:18px}}
.card{background:#fff;border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:active{transform:scale(.98)}
.im{position:relative;aspect-ratio:1;background:#ebe7da}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.pill{position:absolute;left:8px;top:8px;background:var(--o);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.ci{padding:10px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.ci h3{font-size:14.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.pr{color:var(--g);font-weight:700;font-size:18px;font-family:'Baloo Da 2',sans-serif}
.pr small{font-family:'Hind Siliguri';font-size:12px;color:var(--m);font-weight:500}
.sk{aspect-ratio:.82;border-radius:18px;background:linear-gradient(100deg,#ebe7da 30%,#f6f3ea 50%,#ebe7da 70%);background-size:300% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-100% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--m);padding:50px 10px;font-size:15px}
footer{text-align:center;color:var(--m);font-size:12.5px;margin-top:28px;padding:0 20px}
/* ads */
.ad{margin:14px auto 0;text-align:center;max-width:100%}
.ad small{display:block;font-size:11px;color:var(--m);margin-bottom:5px}
.ad.card2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 6px 8px;overflow:hidden}
.ad.s{padding:0 14px;min-height:62px;overflow:hidden}
.ad iframe{border:0;max-width:100%}
/* detail page */
#ov{position:fixed;inset:0;background:var(--bg);display:none;z-index:20;overflow:auto}
#ov.on{display:block;animation:in .2s ease-out}
@keyframes in{from{transform:translateX(28px);opacity:0}}
#sheet{max-width:600px;margin:auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:3;background:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.top button{width:40px;height:40px;border:0;background:none;font-size:26px;border-radius:50%;color:var(--t)}
.top span{font-weight:700;font-size:17px}
.pic{background:#efece3}
.pic img{width:100%;max-height:68vh;object-fit:contain;display:block;margin:auto}
.pd{background:#fff;padding:14px 16px 16px}
.sv{color:var(--o);font-size:14px;font-weight:600}
.pp{display:flex;align-items:baseline;gap:10px}
.pp .pr{font-size:32px;color:var(--o);line-height:1.2}
.pp s{color:var(--m);font-size:16px}
.pd h2{font-size:18.5px;line-height:1.5;margin-top:6px;font-weight:700}
.ds{background:#fff;margin-top:10px;padding:14px 16px}
.ds h4{font-size:16px;margin-bottom:8px}
.ds p{color:#3a463f;line-height:1.75;white-space:pre-wrap;font-size:15.5px}
.rec{padding:6px 14px 18px;margin-top:6px}
.rec h3{font-family:'Baloo Da 2',sans-serif;font-size:19px;color:var(--gd);text-align:center;padding:14px 0 12px}
.rec h3::before,.rec h3::after{content:"❤";color:var(--r);font-size:12px;margin:0 8px;vertical-align:middle}
.rec #rg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bar{position:sticky;bottom:0;margin-top:auto;background:#fff;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.buy{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 20px;border-radius:50px;background:linear-gradient(135deg,#ff8a3d,#f04e0f);color:#fff;font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 5px 14px rgba(240,78,15,.4)}
.buy:active{transform:scale(.97)}
</style></head><body>
